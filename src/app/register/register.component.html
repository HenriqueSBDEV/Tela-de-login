<div class="login-page">
  <div class="ambiance" aria-hidden="true"></div>

  <main class="login-shell">
    <section class="brand-panel">
      <img
        class="brasao"
        src="brasao-uesc.png"
        width="168"
        height="168"
        alt="Brasão da Universidade Estadual de Santa Cruz"
      />
      <p class="brand-mark">UESC</p>
      <p class="motto">In Altum</p>
      <h1 class="brand-title">Acesso</h1>
      <p class="brand-copy">Crie sua conta para autenticar e receber um Access Token.</p>
    </section>

    <section class="form-panel">
      <header class="form-intro">
        <h2>Criar conta</h2>
        <p>Informe e-mail e senha. Depois você poderá entrar normalmente.</p>
      </header>

      <form class="login-form" (ngSubmit)="criarConta()">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="nome@uesc.br"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            required
            minlength="6"
          />
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <input
            type="password"
            id="confirmarSenha"
            name="confirmarSenha"
            [(ngModel)]="confirmarSenha"
            placeholder="Repita a senha"
            autocomplete="new-password"
            required
            minlength="6"
          />
        </div>

        <p class="erro" *ngIf="erro" role="alert">{{ erro }}</p>
        <p class="sucesso" *ngIf="sucesso" role="status">{{ sucesso }}</p>

        <button type="submit" class="btn-entrar" [disabled]="enviando">
          <span>{{ enviando ? 'Criando…' : 'Criar conta' }}</span>
        </button>
      </form>

      <div class="links">
        <p>Já possui uma conta?</p>
        <a routerLink="/login" class="link-button criar-conta">Entrar</a>
      </div>
    </section>
  </main>
</div>
