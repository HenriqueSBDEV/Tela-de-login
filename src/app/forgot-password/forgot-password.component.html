<div class="login-page">
  <div class="ambiance" aria-hidden="true"></div>

  <main class="login-shell">
    <section class="brand-panel">
      <img
        class="brasao"
        src="brasao-uesc.png"
        width="168"
        height="168"
        alt="Brasão da Universidade Estadual de Santa Cruz"
      />
      <p class="brand-mark">UESC</p>
      <p class="motto">In Altum</p>
      <h1 class="brand-title">Acesso</h1>
      <p class="brand-copy">Recuperação de senha em modo demonstração.</p>
    </section>

    <section class="form-panel">
      <header class="form-intro">
        <h2>Esqueci minha senha</h2>
        <p>Informe o e-mail da conta. Nesta demo, apenas simulamos o envio.</p>
      </header>

      <form class="login-form" (ngSubmit)="enviar()" *ngIf="!enviado">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="nome@uesc.br"
            autocomplete="username"
            required
          />
        </div>

        <button type="submit" class="btn-entrar">
          <span>Enviar instruções</span>
        </button>
      </form>

      <p class="sucesso" *ngIf="enviado" role="status">
        Se existir uma conta para <strong>{{ email }}</strong>, as instruções
        teriam sido enviadas. (Simulação — sem e-mail real.)
      </p>

      <div class="links">
        <a routerLink="/login" class="link-button criar-conta">Voltar ao login</a>
      </div>
    </section>
  </main>
</div>
